name: Deploy live builds
on: push
jobs:
  build:
    uses: jamespetts/simutrans-pak128.britain/.github/workflows/build.yml@master
    with:
      pakset_ref: ${{ github.ref }}

  upload:
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Workarround: retrieve the cache key of the build.
      - name: Download build metadata
        uses: actions/download-artifact@v4
        with:
          name: build-metadata
      - run: |
          echo "pakset_sha=$(jq -r '.pakset_version' ./build-metadata.json)" >> "$GITHUB_ENV"
          echo "simutrans_sha=$(jq -r '.makeobj_version' ./build-metadata.json)" >> "$GITHUB_ENV"
      # End of workarround

      - name: Load Build results from cache
        uses: actions/cache@v4
        with:
          path: ./pak128.Britain-Ex
          key: nightly-${{ env.pakset_sha }}@${{ env.simutrans_sha }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pak128.britain-ex
          path: pak128.Britain-Ex
